<div class="auth-page">
  <p-card styleClass="auth-card">
    <ng-template pTemplate="header">
      <div class="auth-header">
        <h1>Yeni Parola Belirle</h1>
        <p>Hesabınız için yeni parolanızı oluşturun.</p>
      </div>
    </ng-template>

    @if (!token) {
      <p-message
        severity="error"
        text="Parola sıfırlama bağlantısı geçersizdir.">
      </p-message>

      <a
        routerLink="/forgot-password"
        class="back-link">
        Yeni bağlantı iste
      </a>
    }
    @else {
      <form
        [formGroup]="form"
        (ngSubmit)="submit()"
        class="auth-form">

        <div class="form-field">
          <label for="newPassword">Yeni Parola</label>

          <p-password
            inputId="newPassword"
            formControlName="newPassword"
            [toggleMask]="true"
            autocomplete="new-password"
            placeholder="Yeni parolanız"
            styleClass="password-field"
            inputStyleClass="password-input">
          </p-password>
        </div>

        <div class="form-field">
          <label for="confirmPassword">Yeni Parola Tekrar</label>

          <p-password
            inputId="confirmPassword"
            formControlName="confirmPassword"
            [feedback]="false"
            [toggleMask]="true"
            autocomplete="new-password"
            placeholder="Yeni parolanızı tekrar girin"
            styleClass="password-field"
            inputStyleClass="password-input">
          </p-password>
        </div>

        @if (
          form.touched &&
          form.hasError('passwordMismatch')
        ) {
          <small class="validation-error">
            Girilen parolalar birbiriyle aynı değildir.
          </small>
        }

        @if (errorMessage()) {
          <p-message
            severity="error"
            [text]="errorMessage()!">
          </p-message>
        }

        <p-button
          type="submit"
          label="Parolayı Değiştir"
          icon="pi pi-key"
          [loading]="loading()"
          [disabled]="loading()"
          styleClass="auth-button">
        </p-button>
      </form>
    }
  </p-card>
</div>
