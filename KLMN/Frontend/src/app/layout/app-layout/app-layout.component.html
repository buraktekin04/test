<div
  class="app-shell"
  [class.sidebar-open]="sidebarOpen()">

  <div class="sidebar-container">
    <app-sidebar
      (navigationSelected)="closeSidebar()">
    </app-sidebar>
  </div>

  @if (sidebarOpen()) {
    <div
      class="sidebar-overlay"
      (click)="closeSidebar()">
    </div>
  }

  <div class="app-main">
    <app-topbar
      (sidebarToggle)="toggleSidebar()">
    </app-topbar>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
