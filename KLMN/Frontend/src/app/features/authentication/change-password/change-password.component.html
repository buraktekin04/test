<div class="auth-page">
  <p-card styleClass="auth-card">
    <ng-template pTemplate="header">
      <div class="auth-header">
        <h1>Parola Değiştir</h1>
        <p>Hesap parolanızı güncelleyin.</p>
      </div>
    </ng-template>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="auth-form">

      <div class="form-field">
        <label for="currentPassword">Mevcut Parola</label>
        <p-password
          inputId="currentPassword"
          formControlName="currentPassword"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="current-password"
          styleClass="password-field"
          inputStyleClass="password-input">
        </p-password>
      </div>

      <div class="form-field">
        <label for="newPassword">Yeni Parola</label>
        <p-password
          inputId="newPassword"
          formControlName="newPassword"
          [toggleMask]="true"
          autocomplete="new-password"
          styleClass="password-field"
          inputStyleClass="password-input">
        </p-password>
      </div>

      <div class="form-field">
        <label for="confirmPassword">Yeni Parola Tekrar</label>
        <p-password
          inputId="confirmPassword"
          formControlName="confirmPassword"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="new-password"
          styleClass="password-field"
          inputStyleClass="password-input">
        </p-password>
      </div>

      @if (
        form.touched &&
        form.hasError('passwordMismatch')
      ) {
        <small class="validation-error">
          Yeni parolalar birbiriyle aynı değildir.
        </small>
      }

      @if (errorMessage()) {
        <p-message
          severity="error"
          [text]="errorMessage()!">
        </p-message>
      }

      <p-button
        type="submit"
        label="Parolayı Güncelle"
        icon="pi pi-key"
        [loading]="loading()"
        [disabled]="loading()"
        styleClass="auth-button">
      </p-button>
    </form>
  </p-card>
</div>
