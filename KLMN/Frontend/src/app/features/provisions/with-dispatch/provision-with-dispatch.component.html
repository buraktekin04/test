<div class="provision-page">
 <section class="provision-card">
  <h2><i class="pi pi-file-import"></i> Provizyon Sevkli Giriş</h2>
  <form [formGroup]="form" (ngSubmit)="save()">
   <div class="provision-grid">
    <label class="provision-field wide"><span class="provision-field-label">Sevk Kayıt Numarası <span class="provision-required">*</span></span>
     <input formControlName="dispatchReference" placeholder="Sevk numarasını giriniz" autocomplete="off"/>
    </label>
    <label class="provision-field wide"><span class="provision-field-label">Kabul Yapan Hastane <span class="provision-required">*</span></span>
     <p-select formControlName="hospitalId" [options]="hospitals()"
      optionLabel="label" optionValue="id" [filter]="true"
      filterBy="label" placeholder="Hastane seçiniz" [fluid]="true" appendTo="body"/>
    </label>
   </div>
   <p class="provision-note">Provizyon yalnız Yeni durumundaki sevklere ve
    sevk kapsamına uygun hastanelere alınabilir.</p>
   @if(error()){<div role="alert" class="provision-error">{{error()}}</div>}
   @if(result();as saved){
    <div class="provision-success" role="status">
     {{saved.provisionNo}} numaralı provizyon oluşturuldu.
     <a class="provision-link-button provision-link-button--small" [routerLink]="['/app/provisions/query']"
      [queryParams]="{provisionNo:saved.provisionNo}"><i class="pi pi-arrow-right"></i> Kaydı görüntüle</a>
    </div>
   }
   <div class="provision-actions"><p-button type="submit" label="Provizyon Al" icon="pi pi-check"
     [loading]="loading()" [disabled]="form.invalid||loading()||result()!==null"/>
    <a class="provision-link-button" routerLink="/app/provisions/query">
     <i class="pi pi-search"></i> Provizyon Sorgulama</a></div>
  </form>
 </section>
</div>
